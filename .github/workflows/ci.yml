name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is an Intel runner and the oldest supported macOS;
        # macos-latest covers Apple Silicon on the newest macOS.
        os: [macos-13, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: swift run LidGoCoreTests
      - name: Build CLI
        run: swift build --product lidgo
      - name: Command tests
        run: bash tests/run_tests.sh
      - name: Release build without warnings
        run: swift build -c release -Xswiftc -warnings-as-errors
